name = "pdl"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve built SPA from dist/ alongside API routes.
# After `bun run build`, `wrangler deploy` ships both.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pdl"
# Fill in after running `wrangler d1 create pdl`:
database_id = "d0e1ac8a-709e-4863-9044-0e5140379b95"
migrations_dir = "migrations"
